<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCG SNKRDUNK 單卡 & PSA10 批量查價</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1050px; margin: 25px auto; padding: 0 15px; background: #f1f5f9; color: #1e293b; }
        .card-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        textarea { width: 100%; height: 130px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; font-family: monospace; }
        .controls { display: flex; gap: 15px; align-items: center; margin-top: 15px; flex-wrap: wrap; }
        input[type="number"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 85px; font-size: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .table-wrap { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; min-width: 750px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        th { background: #f8fafc; font-weight: 600; font-size: 14px; color: #475569; }
        img.thumb { width: 46px; height: 64px; object-fit: cover; border-radius: 4px; background: #e2e8f0; }
        .price-main { font-weight: 700; font-size: 15px; }
        .price-hkd { color: #16a34a; font-size: 13px; font-weight: 600; }
        .badge-psa { background: #fef2f2; color: #dc2626; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .link-btn { font-size: 12px; color: #2563eb; text-decoration: none; }
        .link-btn:hover { text-decoration: underline; }
        .summary-box { display: flex; justify-content: flex-end; gap: 30px; margin-top: 15px; padding: 15px 20px; background: white; border-radius: 12px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.06); flex-wrap: wrap; }
    </style>
</head>
<body>

    <h2>⚡ PTCG SNKRDUNK 批量查價（單卡 vs PSA10）</h2>

    <div class="card-box">
        <label><strong>輸入系列 & 卡號（每行一張，例如：SV8 132/106）</strong></label>
        <textarea id="cardInput" placeholder="SV8 132/106&#10;SV8a 217/187&#10;SV2a 201/165"></textarea>
        
        <div class="controls">
            <label>匯率 (1 JPY = HKD)：
                <input type="number" id="rateInput" value="0.051" step="0.001">
            </label>
            <button id="searchBtn" onclick="startBatchSearch()">立即批量查價</button>
            <span id="statusText" style="color: #64748b; font-size: 14px;"></span>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>卡圖</th>
                    <th>搜尋關鍵字</th>
                    <th>卡牌名稱</th>
                    <th>單卡最低價</th>
                    <th><span class="badge-psa">PSA 10</span> 最低價</th>
                    <th>PSA10 倍率</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>

    <div class="summary-box" id="summaryBox">
        <div>單卡總計：¥0 (HK$0.0)</div>
        <div style="color:#dc2626;">PSA10 總計：¥0 (HK$0.0)</div>
    </div>

    <script>
        async function startBatchSearch() {
            const rawText = document.getElementById('cardInput').value;
            const rate = parseFloat(document.getElementById('rateInput').value) || 0.051;
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            if (lines.length === 0) return alert('請至少輸入一張卡號！');

            const btn = document.getElementById('searchBtn');
            const statusText = document.getElementById('statusText');
            const tbody = document.getElementById('resultBody');
            
            btn.disabled = true;
            tbody.innerHTML = '';
            statusText.innerText = `正在查詢 ${lines.length} 張卡（每張約需 1 秒）...`;

            try {
                const response = await fetch('/api/batch-price', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cards: lines })
                });

                const data = await response.json();
                let totalRawJpy = 0;
                let totalPsaJpy = 0;

                data.results.forEach(item => {
                    const tr = document.createElement('tr');
                    if (item.status === 'ok') {
                        let rawHtml = '<span style="color:#94a3b8;">無資料</span>';
                        if (item.raw && item.raw.priceJpy > 0) {
                            totalRawJpy += item.raw.priceJpy;
                            rawHtml = `
                                <div class="price-main">¥${item.raw.priceJpy.toLocaleString()}</div>
                                <div class="price-hkd">HK$${(item.raw.priceJpy * rate).toFixed(1)}</div>
                                <a class="link-btn" href="${item.raw.url}" target="_blank">單卡頁面 ↗</a>
                            `;
                        }

                        let psaHtml = '<span style="color:#94a3b8;">無資料</span>';
                        if (item.psa10 && item.psa10.priceJpy > 0) {
                            totalPsaJpy += item.psa10.priceJpy;
                            psaHtml = `
                                <div class="price-main" style="color:#dc2626;">¥${item.psa10.priceJpy.toLocaleString()}</div>
                                <div class="price-hkd">HK$${(item.psa10.priceJpy * rate).toFixed(1)}</div>
                                <a class="link-btn" href="${item.psa10.url}" target="_blank">PSA10 頁面 ↗</a>
                            `;
                        }

                        let ratioHtml = '-';
                        if (item.raw?.priceJpy > 0 && item.psa10?.priceJpy > 0) {
                            const ratio = (item.psa10.priceJpy / item.raw.priceJpy).toFixed(2);
                            ratioHtml = `<strong>${ratio}x</strong>`;
                        }

                        tr.innerHTML = `
                            <td><img class="thumb" src="${item.image}" alt=""></td>
                            <td><strong>${item.query}</strong></td>
                            <td style="font-size:14px;">${item.name}</td>
                            <td>${rawHtml}</td>
                            <td>${psaHtml}</td>
                            <td>${ratioHtml}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td>-</td>
                            <td><strong>${item.query}</strong></td>
                            <td colspan="4" style="color:#dc2626;">${item.message}</td>
                        `;
                    }
                    tbody.appendChild(tr);
                });

                document.getElementById('summaryBox').innerHTML = `
                    <div>單卡總計：¥${totalRawJpy.toLocaleString()} (HK$${(totalRawJpy * rate).toFixed(1)})</div>
                    <div style="color:#dc2626;">PSA10 總計：¥${totalPsaJpy.toLocaleString()} (HK$${(totalPsaJpy * rate).toFixed(1)})</div>
                `;
                statusText.innerText = '查詢完成！';

            } catch (err) {
                statusText.innerText = '查詢出錯，請稍後再試。';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
